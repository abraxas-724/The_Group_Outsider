<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="css/base-responsive.css" />
  <link rel="stylesheet" href="css/style of we.css" />
  <link rel="stylesheet" href="css/about-us-inline.css" />
  <title>关于我们</title>
</head>

<body>
  <button id="back-btn" type="button" aria-label="返回上一页" title="返回" class="btn-back">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <span>返回</span>
  </button>

  <header class="about-hero" role="banner">
    <div class="hero-inner">
      <h1 class="hero-title" aria-label="关于我们·制作组">关于我们 <span class="accent">/ TEAM</span></h1>
      <p class="hero-sub">我们是一群对叙事、交互与代码审美有执念的创作者。下面是项目的核心制作成员，你可以点击任意头像前往他们的个人页面。</p>
    </div>
  </header>

  <main id="main" class="about-main" aria-labelledby="team-heading">
    <section class="team-section" aria-label="制作成员">
      <h2 id="team-heading" class="section-title">核心成员</h2>
      <div id="team-grid" class="team-grid" role="list"></div>
    </section>

    <section class="culture-section" aria-label="创作理念">
      <h2 class="visually-hidden">创作理念</h2>
      <div class="culture-card">
        <p class="culture-line">叙事应当是可以被“操纵”的体验，而不是被动观看。</p>
        <p class="culture-line">我们在意像素的呼吸感、过渡的力度曲线、与玩家关注路径的暗示。</p>
        <p class="culture-line">技术手段只是骨架，情绪张力才是血肉。</p>
      </div>
    </section>
  </main>

  <noscript>
    <div class="noscript-fallback">
      <h2>成员列表 (JS 关闭 — 精简版)</h2>
      <ul>
        <li>史雨函</li>
        <li>翟一舟</li>
        <li>杨舒童</li>
        <li>黄昊</li>
        <li>李子豪</li>
        <li>王妤文</li>
      </ul>
    </div>
  </noscript>

  <script src="js/about-us-inline.js"></script>
  <script src="js/systems/we.js"></script>
</body>

</html>
